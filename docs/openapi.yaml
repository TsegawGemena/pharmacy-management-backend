openapi: 3.0.3
info:
  title: Gammo Pharmacy API
  description: |
    REST API for Gammo Pharmacy Clinical Management System.

    **Auth:** JWT Bearer token on protected routes.

    **Status:** Auth endpoints are live. Other modules return `501` until implemented.
  version: 1.0.0
  contact:
    name: Gammo Development Association

servers:
  - url: http://localhost:5000/api
    description: Local development
  - url: https://YOUR-DEPLOYED-URL/api
    description: Production (replace after deploy)

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Products
  - name: Inventory
  - name: Adjustments
  - name: Suppliers
  - name: Purchase Orders
  - name: POS / Sales
  - name: Invoices
  - name: Reports
  - name: Attendance
  - name: Settings

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      example:
        message: Invalid employee ID or password

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          example: EMP-001
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [Admin, Pharmacist]

    LoginRequest:
      type: object
      required: [employeeId, password]
      properties:
        employeeId:
          type: string
          example: EMP-001
        password:
          type: string
          example: Pharmacy@123

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    ForgotPasswordRequest:
      type: object
      required: [employeeId]
      properties:
        employeeId:
          type: string
        email:
          type: string
          format: email

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                  currency:
                    type: string
                    example: ETB
                  vatRate:
                    type: number
                    example: 0.15

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with employee ID and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic success message

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (client clears token)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /users/me:
    get:
      tags: [Users]
      summary: Get profile (planned)
      security: [{ bearerAuth: [] }]
      responses:
        '501':
